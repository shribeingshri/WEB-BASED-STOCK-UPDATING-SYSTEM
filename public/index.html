<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buildmore Ventures LLP — Stock &amp; Inventory System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div class="app-shell">
    <div id="mobileBackdrop" class="mobile-backdrop"></div>

    <!-- Persistent Collapsible Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Primary Navigation">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark">BV</div>
          <div class="brand-text">
            <span class="brand-name" id="sidebarCompanyName">Buildmore Ventures</span>
            <span class="brand-sub">Inventory Control</span>
          </div>
        </div>
        <button id="collapseSidebarBtn" class="icon-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
          <i data-lucide="panel-left-close"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Operations</div>
        <button class="nav-item active" data-page="overview">
          <i data-lucide="layout-dashboard"></i>
          <span class="nav-label">Overview</span>
        </button>
        <button class="nav-item" data-page="inventory">
          <i data-lucide="package"></i>
          <span class="nav-label">Inventory</span>
        </button>
        <button class="nav-item" data-page="stock-in">
          <i data-lucide="arrow-down-left"></i>
          <span class="nav-label">Stock In</span>
        </button>
        <button class="nav-item" data-page="stock-out">
          <i data-lucide="arrow-up-right"></i>
          <span class="nav-label">Stock Out</span>
        </button>
        <button class="nav-item" data-page="transactions">
          <i data-lucide="history"></i>
          <span class="nav-label">Transactions</span>
        </button>
        <button class="nav-item" data-page="alerts">
          <i data-lucide="alert-triangle"></i>
          <span class="nav-label">Low Stock Alerts</span>
          <span id="sidebarAlertBadge" class="nav-badge" style="display:none;">0</span>
        </button>

        <div class="nav-section-label admin-only" style="display:none;">Administration</div>
        <button class="nav-item admin-only" data-page="reports" style="display:none;">
          <i data-lucide="bar-chart-3"></i>
          <span class="nav-label">Reports &amp; Analytics</span>
        </button>
        <button class="nav-item admin-only" data-page="users" style="display:none;">
          <i data-lucide="users"></i>
          <span class="nav-label">User Management</span>
        </button>
        <button class="nav-item admin-only" data-page="settings" style="display:none;">
          <i data-lucide="settings"></i>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <span class="live-dot" id="socketStatusDot" title="Real-time sync connected"></span>
        <span class="sidebar-footer-text" id="socketStatusText">Live sync active</span>
      </div>
    </aside>

    <!-- Main Content Shell -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobileMenuBtn" class="icon-btn" aria-label="Open menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="global-search">
            <i data-lucide="search"></i>
            <input
              id="globalSearchInput"
              type="search"
              placeholder="Search products by name, SKU, or category..."
              aria-label="Global inventory search"
            />
          </div>
        </div>

        <div class="topbar-right">
          <div style="position:relative;">
            <button id="notifBellBtn" class="icon-btn" aria-label="Low stock notifications">
              <i data-lucide="bell"></i>
              <span id="topbarAlertDot" class="notif-dot" style="display:none;"></span>
            </button>
            <div id="notifDropdown" class="dropdown-panel" aria-label="Notifications panel">
              <div class="card-header" style="padding:10px 14px;">
                <strong style="font-size:13px;">Active Stock Alerts</strong>
                <button class="btn btn-sm" id="viewAllAlertsBtn">View all</button>
              </div>
              <div id="notifList" style="max-height:280px; overflow-y:auto;"></div>
            </div>
          </div>

          <div class="user-chip">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-meta">
              <span class="user-name" id="topUserName">Loading...</span>
              <span class="user-role" id="topUserRole">—</span>
            </div>
          </div>

          <button id="logoutBtn" class="btn btn-sm" title="Sign out">
            <i data-lucide="log-out"></i>
            <span>Logout</span>
          </button>
        </div>
      </header>

      <main id="pageContent" class="page-content">
        <div class="empty-state">Loading workspace...</div>
      </main>
    </div>
  </div>

  <!-- Reusable Modal -->
  <div id="appModalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h2 id="appModalTitle" class="modal-title">Modal</h2>
        <button id="appModalClose" class="icon-btn" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="appModalBody" class="modal-body"></div>
      <div id="appModalFooter" class="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/pages/overview.js"></script>
  <script src="/js/pages/inventory.js"></script>
  <script src="/js/pages/stockIn.js"></script>
  <script src="/js/pages/stockOut.js"></script>
  <script src="/js/pages/transactions.js"></script>
  <script src="/js/pages/alerts.js"></script>
  <script src="/js/pages/reports.js"></script>
  <script src="/js/pages/users.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
